name: Update calendar

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps chromium

      - name: Run scraper
        env:
          FOGIS_USERNAME: ${{ secrets.FOGIS_USERNAME }}
          FOGIS_PASSWORD: ${{ secrets.FOGIS_PASSWORD }}
        run: python -c "from client import get_schedule; print(get_schedule())"

      - name: Build calendar
        if: ${{ hashFiles('uppdrag.csv') != '' }}
        run: python export_ics.py --csv uppdrag.csv --out calendar.ics

      - name: Commit updates
        if: ${{ hashFiles('calendar.ics') != '' }}
        run: |
          git add calendar.ics
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git -c user.name="github-actions[bot]" -c user.email="github-actions[bot]@users.noreply.github.com" commit -m "Update calendar data"
            git push
          fi

      - name: Skip notes
        if: ${{ hashFiles('uppdrag.csv') == '' }}
        run: echo "No uppdrag.csv found; skipping calendar build."

      - name: Skip notes
        if: ${{ hashFiles('calendar.ics') == '' }}
        run: echo "No calendar.ics generated; skipping commit."
